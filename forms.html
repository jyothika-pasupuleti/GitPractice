<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Auditions</title>
</head>
<body>
    <center><h1>AJ Auditions</h1></center>
    <form>
        <label>First Name: </label>
        <input type = 'text'><br><br>
        <label for="Last Name">Last Name: </label>
        <input type = 'text' id = 'Last Name'><br><br>
        <label>Phone no.: </label>
        <input type = 'tel'><br><br>
        <label>Date of Birth: </label>
        <input type = 'date'><br><br>
        <label>Upload image: </label>
        <input type="file" accept = 'image/*' alt="Submit"><br><br>
        
        <label>Proficient in acting: </label><br>
        <input type = 'range'><br><br>
        <label>Favourite colour: </label>
        <input type = 'color'><br><br>
        <label>Gender : </label>
    

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br>

        <p>Languages known : </p>

        <input type = 'checkbox' id = 'Telugu' name = 'Languages known' value = 'Telugu'>
        <label for = 'Telugu'>Telugu</label>

        <input type = 'checkbox' id = 'Hindi' name = 'Languages known' value = 'Hindi'>
        <label for = 'Hindi'>Hindi</label>

        <input type = 'checkbox' id = 'English' name = 'Languages known' value = 'English'>
        <label for = 'English'>English</label>

        <input type = 'checkbox' id = 'Tamil' name = 'Languages known' value = 'Tamil'>
        <label for = 'Tamil'>Tamil</label><br><br>

        <label>Portfolio : </label>
        <input type = 'file'><br><br>

        
        <input type = 'submit' value = 'Submit'>
        
    </form>


</body>
</html>
